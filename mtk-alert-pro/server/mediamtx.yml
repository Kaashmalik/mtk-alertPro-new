###############################################
# MTK AlertPro Media Server Configuration
# MediaMTX (formerly rtsp-simple-server)
###############################################

#
# General Settings
#
logLevel: info
logDestinations: [stdout]
logFile: ""

# Read timeout
readTimeout: 10s
# Write timeout
writeTimeout: 10s
# Read buffer count
readBufferCount: 2048
# UDP max payload size
udpMaxPayloadSize: 1472

#
# API Configuration
#
api: yes
apiAddress: :9997
# API is accessible from any IP (for Docker networking)

#
# Metrics (Prometheus)
#
metrics: yes
metricsAddress: :9998

#
# RTSP Server
#
rtsp: yes
protocols: [tcp, udp]
# RTSP encryption (none for internal use, set to optional for external)
encryption: "no"
# RTSP port
rtspAddress: :8554
# RTP ports for UDP
rtpAddress: :8000
rtcpAddress: :8001
# Server key and certificate for RTSPS (if enabled)
serverKey: ""
serverCert: ""

#
# RTMP Server (for RTMP camera sources)
#
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

#
# HLS Server (for mobile app playback)
#
hls: yes
hlsAddress: :8888
# Generate HLS on demand when a client connects
hlsAlwaysRemux: no
# Use low-latency HLS
hlsVariant: lowLatency
# Number of segments to keep
hlsSegmentCount: 7
# Duration of each segment
hlsSegmentDuration: 1s
# Part duration for low-latency HLS
hlsPartDuration: 200ms
# Maximum segment size
hlsSegmentMaxSize: 50M
# Allow CORS from any origin (for mobile app)
hlsAllowOrigin: '*'
# Enable directory listing for debugging
hlsDirectory: ""

#
# WebRTC Server (for ultra-low latency)
#
webrtc: yes
webrtcAddress: :8889
# Allow CORS
webrtcAllowOrigin: '*'
# Public IP (leave empty for auto-detection, set for cloud deployment)
webrtcLocalIPs: []
# Additional IPs to announce
webrtcAdditionalHosts: []
# ICE servers for NAT traversal
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
  - url: stun:stun1.l.google.com:19302

#
# SRT Server (optional, for professional streaming)
#
srt: no
srtAddress: :8890

#
# Recording Settings
#
record: no
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S
recordFormat: mp4
recordPartDuration: 1s
recordSegmentDuration: 1h
recordDeleteAfter: 24h

#
# Path Defaults
# These settings apply to all paths unless overridden
#
pathDefaults:
  # Source configuration
  source: publisher
  # Enable on-demand source activation (saves resources)
  sourceOnDemand: yes
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 30s
  
  # Source redirect (leave empty)
  sourceRedirect: ""
  
  # Disable authentication by default (managed via API)
  publishUser: ""
  publishPass: ""
  publishIPs: []
  readUser: ""
  readPass: ""
  readIPs: []
  
  # Recording disabled by default
  record: no
  
  # Run external commands on events (for advanced integrations)
  runOnInit: ""
  runOnInitRestart: no
  runOnDemand: ""
  runOnDemandRestart: no
  runOnDemandStartTimeout: 10s
  runOnDemandCloseAfter: 10s
  runOnReady: ""
  runOnReadyRestart: no
  runOnNotReady: ""
  runOnRead: ""
  runOnReadRestart: no
  runOnUnread: ""
  runOnRecordSegmentCreate: ""
  runOnRecordSegmentComplete: ""

#
# Paths Configuration
# Dynamic paths are added via API
# Static paths for testing:
#
paths:
  # Test stream (always available for testing)
  test:
    source: rtsp://rtsp.stream/pattern
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 30s

  # All camera paths are added dynamically via API
  # Example path structure:
  # cam_<camera-id>:
  #   source: rtsp://user:pass@192.168.1.100:554/stream
  #   sourceOnDemand: yes

